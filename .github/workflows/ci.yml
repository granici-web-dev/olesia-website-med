# Continuous integration — the checks that used to be run by hand.
#
# The point of this file is Dependabot. It opens grouped dependency PRs every
# week (see dependabot.yml), and until now nothing verified them: the choice was
# merging blind or checking out every branch locally. A green tick here means
# the types still line up and all three apps still build on that branch.
#
# It also runs all three unit suites, applies every migration to a clean
# Postgres, and builds the API image. What it still does NOT tell you: whether
# a page renders correctly, or whether an integration with Calendly or the bank
# actually works end to end.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless — cancel it
# rather than queue behind it. Never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # `--frozen-lockfile` is the whole point on a Dependabot PR: if the
        # lockfile and package.json disagree, that is the bug, and the install
        # should fail loudly instead of quietly resolving something else.
        run: pnpm install --frozen-lockfile

      # Everything else imports @olesia/shared, and the API also needs the
      # generated Prisma client — neither is committed, so both come first.
      - name: Build shared types
        run: pnpm --filter @olesia/shared exec tsc -p tsconfig.lib.json

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      # 253 files had drifted from the formatter by the time anyone checked
      # (audit A11). One option is the whole policy, so this costs a second and
      # settles every argument about spacing that would otherwise reach review.
      - name: Prettier
        run: pnpm exec prettier --check .

      - name: Typecheck API
        run: pnpm exec tsc -p apps/api/tsconfig.app.json --noEmit

      - name: Typecheck back office
        run: pnpm exec tsc -p apps/back-office/tsconfig.app.json --noEmit

      # All three suites are unit tests over pure functions and finish in a few
      # seconds between them. They ran only on a developer's laptop until
      # 2026-09-10, which is a strange thing to say about the tests that cover
      # the money, the dates and the webhook signatures. The back office joined
      # them on 2026-09-11 with the first specs it has ever had.
      - name: Test API
        run: pnpm nx test api

      - name: Test frontend
        run: pnpm nx test @olesia/frontend

      - name: Test back office
        run: pnpm nx test back-office

      # Only the frontend build typechecks as it goes: `next build` runs tsc.
      # The API is bundled by webpack with SWC and the back office by Vite,
      # and neither typechecks, hence the two explicit steps above. An unused
      # import sat on main for weeks before the back-office step existed.
      - name: Build API
        run: pnpm nx build api

      - name: Build back office
        run: pnpm nx build back-office

      - name: Build frontend
        # Three variables refuse to build a production bundle without a value:
        # the site origin goes into robots.txt, the sitemap and every canonical
        # link (audit A7, F6), and the two API origins are what the pages read
        # and what the forms post to (F+). CI has neither a domain nor an API,
        # so it declares placeholders — what is checked here is that the app
        # compiles, not what it points at.
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          API_URL: https://api.ci.invalid
          NEXT_PUBLIC_API_URL: https://api.ci.invalid
        run: pnpm nx build @olesia/frontend

  # Migrations are the one thing a type error cannot catch and a broken one
  # takes production down on deploy. Applying them to a throwaway Postgres
  # proves the SQL is valid and that the schema they produce matches
  # schema.prisma — i.e. that nobody hand-edited one without the other.
  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olesia_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/olesia_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Schema matches the migrations
        # Exit code 2 means "there is a difference", which here means the
        # migrations do not add up to schema.prisma.
        run: |
          pnpm --filter api exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

  # The image broke twice without anyone finding out until a deploy: once when
  # the workspace `node_modules` stopped being copied and the container could
  # not start at all (PLAN.md step 8e), and once over a pruned lockfile. Both
  # are build failures, and a build is a thing CI can do (audit A11, M9).
  #
  # No push: there is no registry yet, and the question this answers is whether
  # the Dockerfile still produces an image, not where the image goes.
  image:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          target: runtime
          push: false
          # Without a cache every run reinstalls the whole workspace. GitHub's
          # own cache is scoped per branch with a fallback to the default one,
          # which is the shape a Dependabot PR needs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
