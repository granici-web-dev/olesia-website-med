# Production stack: API + Postgres + nightly backups.
#
# Differences from `docker-compose.yml` (which is for local work) that are not
# cosmetic:
#
#  * **Postgres publishes no port.** Locally it is on 5432 so tooling can reach
#    it; on a public host that is a database open to the internet.
#  * **Nothing has a default password.** Every secret comes from the host
#    environment and the stack refuses to start without it — `${VAR:?message}`
#    fails loudly rather than booting with `olesia/olesia`.
#  * **A backup service.** Automated backups are a client requirement
#    (answers v2 §10) and, with patient documents in play, the difference
#    between an incident and a catastrophe.
#
# Run:  docker compose -f docker-compose.prod.yml up -d
# TLS:  terminate it in front of this stack (Caddy/nginx/the platform's own
#       router). The API speaks plain HTTP and must not be exposed directly.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: '3333'
      # Exact origins, no wildcards: the API serves patient data.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      # Public origins. PUBLIC_API_URL builds file URLs; PUBLIC_SITE_URL builds
      # the patient upload link, so it must be the SITE, not the API.
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL}

      UPLOADS_DIR: /app/uploads
      PRIVATE_UPLOADS_DIR: /app/private-uploads

      # Long random values, different from each other. Rotating them logs
      # everyone out, which is the point.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # `Secure` on the refresh cookie. Only ever set this to false behind a
      # proxy that terminates TLS somewhere the cookie never travels in clear.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

      # Booking. Until the client's paid account exists these stay empty and
      # the webhook rejects everything — deliberate, not a misconfiguration.
      CALENDLY_API_TOKEN: ${CALENDLY_API_TOKEN:-}
      CALENDLY_ORG_URI: ${CALENDLY_ORG_URI:-}
      CALENDLY_WEBHOOK_SIGNING_KEY: ${CALENDLY_WEBHOOK_SIGNING_KEY:-}

      # Email. Empty means log-only: leads are still saved, the "send link"
      # button reports that nothing was sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-}

      # Spam protection. Empty disables verification — set it before launch.
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}

      # Patient uploads (§11.14). ⚠ MEDICAL_UPLOAD_RETENTION_DAYS is still a
      # placeholder pending the client's legal answer.
      UPLOAD_LINK_TTL_DAYS: ${UPLOAD_LINK_TTL_DAYS:-30}
      MEDICAL_UPLOAD_RETENTION_DAYS: ${MEDICAL_UPLOAD_RETENTION_DAYS:-180}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-15}
    # Bound to loopback: the reverse proxy in front reaches it, the internet
    # does not. Drop the `127.0.0.1:` prefix only if the platform provides its
    # own private network.
    ports:
      - '127.0.0.1:3333:3333'
    volumes:
      - uploads:/app/uploads
      - private_uploads:/app/private-uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  # Nightly dump of the database AND the uploaded files. Both, because a dump
  # alone restores appointments referencing analyses nobody can open.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      UPLOADS_DIR: /app/uploads
      PRIVATE_UPLOADS_DIR: /app/private-uploads
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/restore.sh:/usr/local/bin/restore.sh:ro
      - backups:/backups
      # Read-only: this container copies files, it never writes to them.
      - uploads:/app/uploads:ro
      - private_uploads:/app/private-uploads:ro
    # A plain sleep loop rather than a cron daemon: one job, no scheduler to
    # misconfigure, and the container's own logs show every run.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          sh /usr/local/bin/backup.sh || echo "BACKUP FAILED"
          sleep 86400
        done

volumes:
  pgdata:
  uploads:
  private_uploads:
  backups:
