services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: olesia
      POSTGRES_PASSWORD: olesia
      POSTGRES_DB: olesia
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olesia -d olesia']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://olesia:olesia@postgres:5432/olesia?schema=public
      PORT: '3333'
      CORS_ORIGINS: http://localhost:3000,http://localhost:4200
      UPLOADS_DIR: /app/uploads
      # Private patient documents — separate dir, never served statically.
      PRIVATE_UPLOADS_DIR: /app/private-uploads
      # Browser-facing origin used to build uploaded-image URLs. Set to the
      # public API domain in production (e.g. https://api.example.com).
      PUBLIC_API_URL: http://localhost:3333
      # Local development only. The API refuses to start without these, and
      # anything reachable from outside this machine needs real ones.
      JWT_ACCESS_SECRET: dev-access-secret-not-for-any-real-deployment
      JWT_REFRESH_SECRET: dev-refresh-secret-not-for-any-real-deployment
      # Plain HTTP locally, so the refresh cookie cannot carry `Secure`.
      COOKIE_SECURE: 'false'
      # Calendly (group-A booking). Passed through from the host environment;
      # the webhook rejects every request until the signing key is set.
      CALENDLY_API_TOKEN: ${CALENDLY_API_TOKEN:-}
      CALENDLY_ORG_URI: ${CALENDLY_ORG_URI:-}
      CALENDLY_WEBHOOK_SIGNING_KEY: ${CALENDLY_WEBHOOK_SIGNING_KEY:-}
    ports:
      - '3333:3333'
    volumes:
      - uploads:/app/uploads
      - private_uploads:/app/private-uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP for checking patient emails by hand; nothing leaves the machine
  # (docs/shape-send-prescription.md). Opt-in, so a plain `up` does not start it:
  #   docker compose --profile mail up -d mailpit
  # then run the API with SMTP_HOST=localhost SMTP_PORT=1025 SMTP_USER=dev
  # SMTP_PASS=dev and read the inbox at http://localhost:8025. The two AUTH
  # flags exist because MailService builds no transport without a user and a
  # password, and Mailpit refuses AUTH over plain SMTP unless told otherwise.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail]
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
  uploads:
  private_uploads:
